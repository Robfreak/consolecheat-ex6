<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Couch-Turnier-Planer · consolecheat</title>
    <meta
      name="description"
      content="Couch-Turnier-Planer: K.-o. oder Liga für 2 bis 16 Namen, Auslosung und Tabelle im Browser. Das Turnier bleibt in diesem Browser. Inoffiziell, nicht von Sony."
    />
    <meta name="theme-color" content="#07090e" />
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%favicon.svg" />
    <script>
      (function () {
        try {
          var s = localStorage.getItem("consolecheat-theme");
          var t =
            s === "light" || s === "dark"
              ? s
              : matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.dataset.theme = t;
          var c = t === "light" ? "#f4f1eb" : "#07090e";
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute("content", c);
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/turnier/main.tsx"></script>
  </body>
</html>
